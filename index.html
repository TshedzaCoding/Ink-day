<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink &amp; Day</title>

    <!-- PWA & Custom Icon Metadata -->
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ink & Day" />
    <meta name="theme-color" content="#FAF6F0" id="theme-color-meta" />

    <!-- Google Fonts: Handwritten ('Caveat', 'Patrick Hand') + Clean UI ('DM Sans') -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              hand: ['"Caveat"', "cursive"],
              journal: ['"Patrick Hand"', "cursive"],
              sans: ['"DM Sans"', "system-ui", "-apple-system", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Prevent theme flash on load -->
    <script>
      (function () {
        try {
          const raw = localStorage.getItem("inkAndDay_prefs_v2");
          if (raw) {
            const prefs = JSON.parse(raw);
            if (prefs && prefs.nightMode) {
              document.documentElement.classList.add("night");
              const meta = document.getElementById("theme-color-meta");
              if (meta) meta.setAttribute("content", "#1B1816");
            }
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* ===================================================================== */
      /* THEME TOKENS: WARM CREAM PAPER (LIGHT) & CHARCOAL SKETCHBOOK (NIGHT)  */
      /* ===================================================================== */
      :root {
        --bg-paper: #faf6f0;
        --bg-card: #fffdf9;
        --bg-soft: #f3ece2;
        --bg-elevated: #fffdf9;
        --border-warm: #e6ddd0;
        --border-dashed: #d5c8b8;
        --ink-main: #2e2924;
        --ink-muted: #7a7067;
        --ink-faint: #aba095;
        --ink-accent: #c06444;
        --ink-sage: #4f7a52;
        --ink-scribble: #463b33;
        --dot-color: #dcd0c0;
        --rule-line: rgba(214, 200, 182, 0.72);
        --margin-line: rgba(212, 134, 134, 0.32);
        --today-bg: #fff9f2;
        --today-border: #dfb59d;
        --washi-start: rgba(235, 209, 177, 0.75);
        --washi-end: rgba(224, 189, 154, 0.52);
        --shadow-paper:
          0 4px 20px -6px rgba(68, 52, 38, 0.08),
          0 1px 3px rgba(68, 52, 38, 0.05);
        --shadow-card: 0 2px 10px -3px rgba(68, 52, 38, 0.06);
        --shadow-float: 0 18px 40px -12px rgba(46, 41, 36, 0.22);
        --backdrop: rgba(46, 41, 36, 0.42);
        --btn-primary-bg: #2e2924;
        --btn-primary-text: #fffdf9;
        --btn-primary-hover: #413a34;
      }

      html.night {
        --bg-paper: #1b1816;
        --bg-card: #25211e;
        --bg-soft: #2e2925;
        --bg-elevated: #2a2521;
        --border-warm: #3a332c;
        --border-dashed: #4c433b;
        --ink-main: #efe6da;
        --ink-muted: #a4998d;
        --ink-faint: #756b61;
        --ink-accent: #df8766;
        --ink-sage: #7eaa81;
        --ink-scribble: #efe6da;
        --dot-color: #38312b;
        --rule-line: rgba(77, 68, 59, 0.65);
        --margin-line: rgba(196, 114, 108, 0.25);
        --today-bg: #2b2420;
        --today-border: #78523f;
        --washi-start: rgba(112, 92, 74, 0.55);
        --washi-end: rgba(94, 75, 59, 0.38);
        --shadow-paper:
          0 6px 24px -8px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-card: 0 2px 10px -3px rgba(0, 0, 0, 0.35);
        --shadow-float: 0 20px 44px -10px rgba(0, 0, 0, 0.65);
        --backdrop: rgba(10, 8, 7, 0.65);
        --btn-primary-bg: #efe6da;
        --btn-primary-text: #1b1816;
        --btn-primary-hover: #dfd3c3;
      }

      /* Base Document Styling */
      html,
      body {
        background-color: var(--bg-paper);
        color: var(--ink-main);
        font-family:
          "DM Sans",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        transition:
          background-color 0.28s ease,
          color 0.28s ease;
      }

      /* Utility Theme Classes */
      .surface-paper {
        background-color: var(--bg-paper);
      }
      .surface-card {
        background-color: var(--bg-card);
        border-color: var(--border-warm);
        box-shadow: var(--shadow-paper);
      }
      .surface-soft {
        background-color: var(--bg-soft);
        border-color: var(--border-warm);
      }
      .border-warm {
        border-color: var(--border-warm);
      }
      .text-ink {
        color: var(--ink-main);
      }
      .text-muted {
        color: var(--ink-muted);
      }
      .text-faint {
        color: var(--ink-faint);
      }
      .text-accent {
        color: var(--ink-accent);
      }

      .btn-primary {
        background-color: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        box-shadow: var(--shadow-card);
      }
      .btn-primary:hover {
        background-color: var(--btn-primary-hover);
      }

      .btn-ghost {
        background-color: var(--bg-card);
        border: 1px solid var(--border-warm);
        color: var(--ink-main);
        box-shadow: var(--shadow-card);
      }
      .btn-ghost:hover {
        background-color: var(--bg-soft);
      }

      /* Subtle Dot-Grid Paper for Day Timeline */
      .paper-dot-grid {
        background-color: var(--bg-card);
        background-image: radial-gradient(
          var(--dot-color) 1.25px,
          transparent 1.25px
        );
        background-size: 20px 20px;
        background-position: 8px 8px;
      }

      /* Lined Notebook Paper for Hybrid Journal */
      .paper-ruled {
        background-color: var(--bg-card);
        background-image:
          linear-gradient(
            90deg,
            transparent 36px,
            var(--margin-line) 36px,
            var(--margin-line) 37.5px,
            transparent 37.5px
          ),
          repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 31px,
            var(--rule-line) 31px,
            var(--rule-line) 32px
          );
        background-position: 0 0;
      }

      /* Decorative Washi Tape */
      .washi-tape {
        background: linear-gradient(
          135deg,
          var(--washi-start),
          var(--washi-end)
        );
        transform: rotate(-1.8deg);
      }

      /* Hand-Drawn Scribble Strike-Through Animation (Time Blocks) */
      .scribble-svg path {
        stroke: var(--ink-scribble);
        stroke-dasharray: 640;
        stroke-dashoffset: 640;
        transition: stroke-dashoffset 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .is-completed .scribble-svg path {
        stroke-dashoffset: 0;
      }

      /* Hand-Drawn Checkbox Checkmark Animation */
      .check-stroke {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        transition: stroke-dashoffset 0.32s cubic-bezier(0.22, 1, 0.36, 1) 0.04s;
      }
      .is-completed .check-stroke {
        stroke-dashoffset: 0;
      }

      /* Inline Journal Task Hand-Drawn Strikethrough */
      .jtask-scribble path {
        stroke: var(--ink-scribble);
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        transition: stroke-dashoffset 0.44s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .jtask-done .jtask-scribble path {
        stroke-dashoffset: 0;
      }

      /* Subtask Mini Scribble */
      .subtask-scribble path {
        stroke: var(--ink-scribble);
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        transition: stroke-dashoffset 0.36s ease-out;
      }
      .subtask-done .subtask-scribble path {
        stroke-dashoffset: 0;
      }

      /* Active Time Block Pulsing Ink Dot & Draining Bar Shimmer */
      @keyframes pulseDot {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.45);
          opacity: 0.45;
        }
      }
      .pulse-ink-dot {
        animation: pulseDot 2.1s ease-in-out infinite;
      }

      @keyframes inkShimmer {
        0% {
          transform: translateX(-100%);
          opacity: 0;
        }
        35% {
          opacity: 0.75;
        }
        75% {
          opacity: 0.75;
        }
        100% {
          transform: translateX(220%);
          opacity: 0;
        }
      }
      .drain-bar-track {
        position: relative;
        overflow: hidden;
      }
      .drain-bar-fill {
        position: relative;
        overflow: hidden;
        transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .drain-bar-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 100%
        );
        animation: inkShimmer 2.8s ease-in-out infinite;
      }
      html.night .drain-bar-fill::after {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(239, 230, 218, 0.38) 50%,
          transparent 100%
        );
      }

      /* Subtle pop on completion */
      @keyframes inkPop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.988);
        }
        100% {
          transform: scale(1);
        }
      }
      .just-completed {
        animation: inkPop 0.32s ease;
      }

      /* Toast Entrance */
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, 14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
      }
      .toast-enter {
        animation: toastIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* Journal Auto-Growing Line Textarea */
      .journal-line-input {
        line-height: 32px;
        min-height: 32px;
        height: 32px;
        overflow: hidden;
        resize: none;
        background: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        width: 100%;
        display: block;
        color: var(--ink-main);
      }
      .journal-line-input:focus {
        outline: none;
      }
      .journal-line-input::placeholder {
        color: var(--ink-faint);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-soft);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-dashed);
        border-radius: 99px;
      }

      /* Time Inputs inherit color-scheme cleanly */
      html.night input[type="time"] {
        color-scheme: dark;
      }
    </style>
  </head>

  <body class="min-h-screen antialiased">
    <!-- ===================================================================== -->
    <!-- COMPACT TOP HEADER (ONLY Brand, View Switcher, Night Toggle, .json)   -->
    <!-- ===================================================================== -->
    <header
      class="sticky top-0 z-30 border-b border-warm backdrop-blur-md transition-colors duration-300"
      style="
        background-color: color-mix(in srgb, var(--bg-paper) 88%, transparent);
      "
    >
      <div
        class="mx-auto max-w-6xl px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2"
      >
        <!-- Minimal Brand Title -->
        <button
          id="btn-brand"
          type="button"
          class="group flex items-center gap-2 rounded-[16px] px-1.5 py-1 transition hover:opacity-85 focus:outline-none"
          aria-label="Ink & Day Home"
        >
          <span
            class="flex h-8 w-8 items-center justify-center rounded-[12px] transition group-hover:rotate-[-4deg]"
            style="
              background-color: var(--btn-primary-bg);
              color: var(--btn-primary-text);
            "
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M5 4.5C5 3.67 5.67 3 6.5 3h11C18.33 3 19 3.67 19 4.5v15c0 .83-.67 1.5-1.5 1.5h-11C5.67 21 5 20.33 5 19.5v-15Z"
              />
              <path d="M8.5 8.5h7" />
              <path d="M8.5 12.5h5" />
              <path d="M8.5 16.5c1.5-.8 3 .8 4.5 0" />
            </svg>
          </span>
          <span
            class="font-hand text-[26px] sm:text-[28px] font-bold tracking-wide text-ink leading-none"
          >
            Ink &amp; Day
          </span>
        </button>

        <!-- Rounded Pill View Switcher -->
        <nav
          aria-label="Calendar views"
          class="order-3 md:order-2 w-full md:w-auto flex justify-center"
        >
          <div
            class="inline-flex w-full md:w-auto items-center gap-1 rounded-full border p-1"
            style="
              background-color: var(--bg-card);
              border-color: var(--border-warm);
              box-shadow: var(--shadow-card);
            "
          >
            <button
              type="button"
              data-view="day"
              class="view-tab flex-1 md:flex-none rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold transition min-h-[36px]"
            >
              Day
            </button>
            <button
              type="button"
              data-view="week"
              class="view-tab flex-1 md:flex-none rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold transition min-h-[36px]"
            >
              Week
            </button>
            <button
              type="button"
              data-view="month"
              class="view-tab flex-1 md:flex-none rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold transition min-h-[36px]"
            >
              Month
            </button>
            <button
              type="button"
              data-view="year"
              class="view-tab flex-1 md:flex-none rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold transition min-h-[36px]"
            >
              Year
            </button>
          </div>
        </nav>

        <!-- Right Utility Actions: Manual Night Mode Toggle + .json -->
        <div class="order-2 md:order-3 flex items-center gap-1.5 sm:gap-2">
          <button
            id="btn-night-toggle"
            type="button"
            aria-label="Toggle night mode"
            title="Toggle Night Mode"
            class="btn-ghost flex h-10 w-10 items-center justify-center rounded-full transition active:scale-95"
          >
            <!-- Hand-drawn Sun / Moon SVG populated dynamically -->
          </button>

          <button
            id="btn-open-json"
            type="button"
            class="btn-ghost relative inline-flex items-center gap-1.5 rounded-full px-3.5 py-2 text-xs sm:text-sm font-semibold transition active:scale-95 min-h-[40px]"
          >
            <svg
              class="h-4 w-4 text-muted"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <span>.json</span>
            <span
              id="json-linked-dot"
              class="hidden h-2 w-2 rounded-full bg-emerald-500"
              title="Local .json file linked"
            ></span>
          </button>
        </div>
      </div>
    </header>

    <!-- ===================================================================== -->
    <!-- MAIN DYNAMIC VIEWPORT                                                 -->
    <!-- ===================================================================== -->
    <main
      id="app-main"
      class="mx-auto max-w-6xl px-3 sm:px-5 py-4 sm:py-6 pb-20"
    >
      <!-- Active View Renders Here -->
    </main>

    <!-- ===================================================================== -->
    <!-- MODAL 1: ADD / EDIT TIME BLOCK                                        -->
    <!-- ===================================================================== -->
    <div
      id="modal-block"
      class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-[3px]"
      style="background-color: var(--backdrop)"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-block-title"
    >
      <div
        class="w-full sm:max-w-md max-h-[92vh] overflow-y-auto rounded-t-[26px] sm:rounded-[26px] border p-5 sm:p-6"
        style="
          background-color: var(--bg-elevated);
          border-color: var(--border-warm);
          box-shadow: var(--shadow-float);
        "
      >
        <div
          class="flex items-center justify-between gap-3 pb-3 border-b border-warm"
        >
          <h2
            id="modal-block-title"
            class="font-hand text-3xl font-bold text-ink leading-none"
          >
            New Time Block
          </h2>
          <button
            type="button"
            data-close-modal="modal-block"
            aria-label="Close"
            class="btn-ghost flex h-9 w-9 items-center justify-center rounded-full text-muted"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="form-block" class="mt-4 space-y-4">
          <input type="hidden" id="block-id" />
          <input type="hidden" id="block-date" />

          <!-- Title -->
          <div>
            <label
              for="block-title"
              class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5"
            >
              Title
            </label>
            <input
              id="block-title"
              type="text"
              required
              placeholder="Deep focus, coffee walk, reading..."
              class="h-11 w-full rounded-[16px] border px-3.5 font-journal text-xl text-ink focus:outline-none"
              style="
                background-color: var(--bg-paper);
                border-color: var(--border-warm);
              "
            />
          </div>

          <!-- Start & End Time -->
          <div
            class="rounded-[18px] border p-3.5"
            style="
              background-color: var(--bg-paper);
              border-color: var(--border-warm);
            "
          >
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label
                  for="block-start"
                  class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1"
                >
                  Start
                </label>
                <input
                  id="block-start"
                  type="time"
                  required
                  class="h-10 w-full rounded-[14px] border px-3 text-sm font-semibold text-ink focus:outline-none"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                />
              </div>
              <div>
                <label
                  for="block-end"
                  class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1"
                >
                  End
                </label>
                <input
                  id="block-end"
                  type="time"
                  required
                  class="h-10 w-full rounded-[14px] border px-3 text-sm font-semibold text-ink focus:outline-none"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                />
              </div>
            </div>

            <div
              class="mt-2.5 flex flex-wrap items-center justify-between gap-2"
            >
              <div class="flex flex-wrap gap-1.5">
                <button
                  type="button"
                  data-dur="30"
                  class="dur-chip rounded-full border px-2.5 py-1 text-xs font-medium text-muted transition hover:text-ink"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                >
                  30m
                </button>
                <button
                  type="button"
                  data-dur="45"
                  class="dur-chip rounded-full border px-2.5 py-1 text-xs font-medium text-muted transition hover:text-ink"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                >
                  45m
                </button>
                <button
                  type="button"
                  data-dur="60"
                  class="dur-chip rounded-full border px-2.5 py-1 text-xs font-medium text-muted transition hover:text-ink"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                >
                  1h
                </button>
                <button
                  type="button"
                  data-dur="90"
                  class="dur-chip rounded-full border px-2.5 py-1 text-xs font-medium text-muted transition hover:text-ink"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                >
                  1h 30m
                </button>
                <button
                  type="button"
                  data-dur="120"
                  class="dur-chip rounded-full border px-2.5 py-1 text-xs font-medium text-muted transition hover:text-ink"
                  style="
                    background-color: var(--bg-card);
                    border-color: var(--border-warm);
                  "
                >
                  2h
                </button>
              </div>
              <span
                id="modal-duration-preview"
                class="text-xs font-semibold text-accent"
              ></span>
            </div>
            <p
              id="modal-time-error"
              class="hidden mt-2 text-xs font-semibold text-rose-500"
            ></p>
          </div>

          <!-- 6 Warm Journal Pastel Color Swatches -->
          <div>
            <span
              class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5"
            >
              Color
            </span>
            <div
              id="color-picker"
              class="grid grid-cols-3 sm:grid-cols-6 gap-2"
            ></div>
          </div>

          <!-- Subtasks -->
          <div>
            <span
              class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5"
            >
              Subtasks
            </span>
            <div id="modal-subtasks-list" class="space-y-1.5 mb-2"></div>
            <div class="flex gap-2">
              <input
                id="new-subtask-input"
                type="text"
                placeholder="Add a step..."
                class="h-10 flex-1 rounded-[14px] border px-3 font-journal text-lg text-ink focus:outline-none"
                style="
                  background-color: var(--bg-paper);
                  border-color: var(--border-warm);
                "

        function pad2(n) {
          return String(n).padStart(2, "0");
        }

        function toDateKey(d) {
          return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function parseDateKey(key) {
          const [y, m, d] = key.split("-").map(Number);
          return new Date(y, m - 1, d);
        }

        function addDays(dateKey, delta) {
          const d = parseDateKey(dateKey);
          d.setDate(d.getDate() + delta);
          return toDateKey(d);
        }

        function addMonths(dateKey, delta) {
          const d = parseDateKey(dateKey);
          const day = d.getDate();
          d.setDate(1);
          d.setMonth(d.getMonth() + delta);
          const maxDay = new Date(
            d.getFullYear(),
            d.getMonth() + 1,
            0,
          ).getDate();
          d.setDate(Math.min(day, maxDay));
          return toDateKey(d);
        }

        function getMondayOfWeek(dateKey) {
          const d = parseDateKey(dateKey);
          const dow = d.getDay();
          d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
          return toDateKey(d);
        }

        function timeToMinutes(hhmm) {
          if (!hhmm || !hhmm.includes(":")) return 0;
          const [h, m] = hhmm.split(":").map(Number);
          return (h || 0) * 60 + (m || 0);
        }

        function minutesToTime(totalMins) {
          const clamped = Math.max(
            0,
            Math.min(23 * 60 + 59, Math.round(totalMins)),
          );
          return `${pad2(Math.floor(clamped / 60))}:${pad2(clamped % 60)}`;
        }

          const mTotal = Math.max(0, Math.ceil(mins));
          if (mTotal <= 0) return "0m";
          const h = Math.floor(mTotal / 60);
          const m = mTotal % 60;
          if (h === 0) return `${m}m`;
          if (m === 0) return `${h}h`;
          return `${h}h ${m}m`;
        }

          return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

            nowMins,
            remainingMins: remaining,
            remainingText: formatDuration(remaining),
            pctElapsed,
          };
        }

        function getActiveBlockProgress(blk, nowExactMins) {
          if (blk.completed) return null;
          const start = timeToMinutes(blk.start);
          const end = timeToMinutes(blk.end);
          if (end <= start) return null;
          if (nowExactMins < start || nowExactMins >= end) return null;
          const total = end - start;
          const remainingMins = Math.max(0, end - nowExactMins);
          const remainingPct = Math.max(
            0,
            Math.min(100, (remainingMins / total) * 100),
          );
          const label =
            remainingMins < 1
              ? "<1m left"
              : `${formatDuration(remainingMins)} left`;
          return { remainingMins, remainingPct, label };
        }

        function getColorTheme(colorKey) {
          const entry = PASTEL_COLORS[colorKey] || PASTEL_COLORS.sage;
          return state.nightMode ? entry.night : entry.light;
        }

        function escapeHTML(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function genId(prefix = "id") {
          return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
        }

        /* =================================================================== */
        /* 5. JOURNAL NORMALIZATION & PERSISTENCE                              */
        /* =================================================================== */
        function normalizeJournalEntry(raw) {
          if (!raw) {
            return {
              mood: "",
              lines: [{ id: genId("jl"), type: "text", text: "", done: false }],
            };
          }
          // Handle legacy plain string directly
          if (typeof raw === "string") {
            const split = raw.split(/\r?\n/).map((line) => parseRawLine(line));
            return {
              mood: "",
              lines: split.length
                ? split
                : [{ id: genId("jl"), type: "text", text: "", done: false }],
            };
          }

          // Normalize mood (map legacy emojis if any)
          let mood = typeof raw.mood === "string" ? raw.mood : "";
          if (LEGACY_MOOD_MAP[mood]) mood = LEGACY_MOOD_MAP[mood];
          if (mood && !MOOD_FACES.some((m) => m.id === mood)) mood = "";

          // Normalize lines array or legacy notes/gratitude strings
          let lines = [];
          if (Array.isArray(raw.lines)) {
            lines = raw.lines.map((item) => ({
              id: (item && item.id) || genId("jl"),
              type: item && item.type === "task" ? "task" : "text",
              text: item && typeof item.text === "string" ? item.text : "",
              done: Boolean(item && item.done),
            }));
          } else {
            const combined = [];
            if (
              raw.gratitude &&
              typeof raw.gratitude === "string" &&
              raw.gratitude.trim()
            ) {
              combined.push(raw.gratitude.trim());
            }
            if (raw.notes && typeof raw.notes === "string") {
              raw.notes.split(/\r?\n/).forEach((l) => combined.push(l));
            }
            lines = combined.map((l) => parseRawLine(l));
          }

          if (lines.length === 0) {
            lines = [{ id: genId("jl"), type: "text", text: "", done: false }];
          }
          return { mood, lines };
        }

        function parseRawLine(lineStr) {
          const s = String(lineStr || "");
          if (/^\s*\[x\]\s+/i.test(s)) {
            return {
              id: genId("jl"),
              type: "task",
              text: s.replace(/^\s*\[x\]\s+/i, ""),
              done: true,
            };
          }
          if (/^\s*(\[\s?\]|-|\*)\s+/.test(s)) {
            return {
              id: genId("jl"),
              type: "task",
              text: s.replace(/^\s*(\[\s?\]|-|\*)\s+/, ""),
              done: false,
            };
          }
          return { id: genId("jl"), type: "text", text: s, done: false };
        }

        function getJournalForDate(dateKey) {
          if (!state.data.journalByDate[dateKey]) {
            state.data.journalByDate[dateKey] = normalizeJournalEntry(null);
          } else {
            state.data.journalByDate[dateKey] = normalizeJournalEntry(
              state.data.journalByDate[dateKey],
            );
          }
          return state.data.journalByDate[dateKey];
        }

        function getBlocksForDate(dateKey) {
          const list = state.data.blocksByDate[dateKey] || [];
          return [...list].sort((a, b) => {
            const diff = timeToMinutes(a.start) - timeToMinutes(b.start);
            return diff !== 0
              ? diff
              : timeToMinutes(a.end) - timeToMinutes(b.end);
          });
        }

        // First-load sample data: 3 realistic blocks with ONE active right now + 2-line hybrid journal
        function seedInitialData() {
          const t = todayKey();
          const now = new Date();
          const nowMins = now.getHours() * 60 + now.getMinutes();

          // Active block spanning current time so user immediately sees live decreasing animation
          const activeStart = Math.max(0, Math.min(22 * 60 + 30, nowMins - 22));
          const activeEnd = Math.min(23 * 60 + 50, activeStart + 60);

          const blocks = [];

          // Earlier completed block (if room earlier in the day)
          if (activeStart >= 105) {
            const earlyEnd = activeStart - 45;
            const earlyStart = Math.max(0, earlyEnd - 60);
            blocks.push({
              id: genId("blk"),
              title: "Morning Coffee & Planning",
              start: minutesToTime(earlyStart),
              end: minutesToTime(earlyEnd),
              color: "butter",
              subtasks: [],
              completed: true,
            });
          }

          // Currently running live block
          blocks.push({
            id: genId("blk"),
            title: "Deep Focus Session",
            start: minutesToTime(activeStart),
            end: minutesToTime(activeEnd),
            color: "sage",
            subtasks: [
              { id: genId("st"), text: "Sketch outline", done: true },
              { id: genId("st"), text: "Finish first draft", done: false },
            ],
            completed: false,
          });

          // Upcoming later block (with open gap in between)
          if (activeEnd <= 21 * 60 + 45) {
            const lateStart = activeEnd + 45;
            const lateEnd = Math.min(23 * 60 + 50, lateStart + 60);
            blocks.push({
              id: genId("blk"),
              title: "Afternoon Walk & Reset",
              start: minutesToTime(lateStart),
              end: minutesToTime(lateEnd),
              color: "terracotta",
              subtasks: [],
              completed: false,
            });
          } else if (blocks.length < 3 && activeStart >= 210) {
            // Fallback if opened very late at night: add a second earlier block
            const midEnd = activeStart - 135;
            const midStart = Math.max(0, midEnd - 60);
            blocks.push({
              id: genId("blk"),
              title: "Evening Reading & Tea",
              start: minutesToTime(midStart),
              end: minutesToTime(midEnd),
              color: "lavender",
              subtasks: [],
              completed: true,
            });
          }

          state.data = {
            version: 2,
            updatedAt: new Date().toISOString(),
            blocksByDate: { [t]: blocks },
            journalByDate: {
              [t]: {
                mood: "happy",
                lines: [
                  {
                    id: genId("jl"),
                    type: "text",
                    text: "Keeping today calm and intentional — one block at a time.",
                    done: false,
                  },
                  {
                    id: genId("jl"),
                    type: "task",
                    text: "Pick up fresh coffee beans on the way home",
                    done: false,
                  },
                ],
              },
            },
          };
        }

        function loadFromStorage() {
          try {
            const prefsRaw = localStorage.getItem(PREF_KEY);
            if (prefsRaw) {
              const prefs = JSON.parse(prefsRaw);
              if (typeof prefs.nightMode === "boolean") {
                state.nightMode = prefs.nightMode;
              }
            }
          } catch (err) {
            console.warn("Prefs load error:", err);
          }
          applyTheme(false);

          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              seedInitialData();
              saveToStorage(false);
              return;
            }
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
              const normalizedJournals = {};
              Object.entries(parsed.journalByDate || {}).forEach(
                ([dk, entry]) => {
                  normalizedJournals[dk] = normalizeJournalEntry(entry);
                },
              );
              state.data = {
                version: 2,
                updatedAt: parsed.updatedAt || new Date().toISOString(),
                blocksByDate:
                  parsed.blocksByDate && typeof parsed.blocksByDate === "object"
                    ? parsed.blocksByDate
                    : {},
                journalByDate: normalizedJournals,
              };
            } else {
              seedInitialData();
              saveToStorage(false);
            }
          } catch (err) {
            console.error("Data parse error:", err);
            seedInitialData();
            saveToStorage(false);
          }
        }

        function savePreferences() {
          try {
            localStorage.setItem(
              PREF_KEY,
              JSON.stringify({ nightMode: state.nightMode }),
            );
          } catch (err) {
            console.warn("Prefs save error:", err);
          }
        }

        function saveToStorage(triggerFileSync = true) {
          state.data.updatedAt = new Date().toISOString();
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
          } catch (err) {
            console.error("localStorage error:", err);
            showToast("Storage full — export your .json backup", "warn");
          }
          if (triggerFileSync && state.fileHandle) {
            clearTimeout(state.fileWriteTimer);
            state.fileWriteTimer = setTimeout(
              () => writeToLinkedFile(false),
              450,
            );
          }
        }

        async function writeToLinkedFile(showConfirm = false) {
          if (!state.fileHandle) return false;
          try {
            const writable = await state.fileHandle.createWritable();
            await writable.write(JSON.stringify(state.data, null, 2));
            await writable.close();
            if (showConfirm) showToast(`Saved to ${state.linkedFileName}`);
            return true;
          } catch (err) {
            console.error("Linked file write error:", err);
            showToast("Could not write to linked .json file", "warn");
            return false;
          }
        }

        /* =================================================================== */
        /* 6. NIGHT MODE TOGGLE & TOASTS                                       */
        /* =================================================================== */
        function applyTheme(reRender = true) {
          document.documentElement.classList.toggle("night", state.nightMode);
          const meta = document.getElementById("theme-color-meta");
          if (meta)
            meta.setAttribute(
              "content",
              state.nightMode ? "#1B1816" : "#FAF6F0",
            );
          const toggleBtn = document.getElementById("btn-night-toggle");
          if (toggleBtn) {
            toggleBtn.innerHTML = svgThemeToggleIcon(state.nightMode);
            toggleBtn.setAttribute(
              "aria-pressed",
              state.nightMode ? "true" : "false",
            );
          }
          if (reRender) {
            buildModalColorPicker();
            renderApp();
          }
        }

        function showToast(msg, tone = "default") {
          const root = document.getElementById("toast-root");
          if (!root) return;
          clearTimeout(state.toastTimer);
          const bgStyle =
            tone === "warn"
              ? "background-color: #9A3B2E; color: #FFFDF9;"
              : "background-color: var(--btn-primary-bg); color: var(--btn-primary-text);";

          root.innerHTML = `
          <div class="toast-enter pointer-events-auto rounded-full px-4 py-2 text-xs sm:text-sm font-semibold" style="${bgStyle} box-shadow: var(--shadow-float);">
            ${escapeHTML(msg)}
          </div>
        `;
          state.toastTimer = setTimeout(() => {
            root.innerHTML = "";
          }, 2500);
        }

        /* =================================================================== */
        /* 7. HEADER & SHARED SINGLE-TITLE PERIOD NAVIGATOR                    */
        /* =================================================================== */
        function renderHeader() {
          document.querySelectorAll(".view-tab").forEach((btn) => {
            const active = btn.dataset.view === state.view;

              ? "var(--btn-primary-bg)"

          if (toggleBtn)
            toggleBtn.innerHTML = svgThemeToggleIcon(state.nightMode);

          const dot = document.getElementById("json-linked-dot");
          if (dot) dot.classList.toggle("hidden", !state.fileHandle);
        }

        // Single Period Navigation Bar — the ONLY place the current date/period appears!
        function renderSinglePeriodNav(
          titleText,
          showTodayPill,
          subtitleHTML = "",
        ) {
          return `
          <div class="flex flex-col items-center text-center mb-5 sm:mb-6">

              <div class="flex items-center justify-center gap-2.5 min-w-0">

        function renderApp() {
          renderHeader();
          const main = document.getElementById("app-main");
          if (!main) return;

          if (state.view === "day") {
            main.innerHTML = renderDayView();
            initJournalLineHeights();
            syncActiveBlockSignature();
          } else if (state.view === "week") {
            main.innerHTML = renderWeekView();
          } else if (state.view === "month") {
            main.innerHTML = renderMonthView();
          } else {
            main.innerHTML = renderYearView();
          }

        /* =================================================================== */
        /* 8. DAY PLANNER VIEW (Timeline + Active Block Drain + Hybrid Journal)*/
        /* =================================================================== */
        function renderDayView() {
          const dk = state.selectedDate;
          const tKey = todayKey();
          const isToday = dk === tKey;
          const d = parseDateKey(dk);
          const dayTitle = `${DAY_NAMES[d.getDay()]}, ${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`;

          // Whisper-quiet subtle "Time Left in Day" line ONLY when viewing Today
          let subtleDayLeftHTML = "";
          if (isToday) {
            const stats = getDayTimeStats();
            subtleDayLeftHTML = `
            <div class="mt-2 inline-flex items-center gap-2.5 text-xs text-muted">
              <span data-live-day-left class="font-medium tracking-wide">${stats.remainingText} left today</span>
              <span
                class="inline-block h-[2.5px] w-20 sm:w-24 overflow-hidden rounded-full"
                style="background-color: var(--border-warm);"
                aria-hidden="true"
              >
                <span
                  data-live-day-bar
                  class="block h-full rounded-full transition-all duration-1000"
                  style="width: ${stats.pctElapsed.toFixed(1)}%; background-color: var(--ink-muted); opacity: 0.72;"
                ></span>
              </span>
            </div>
          `;
          }

          return `
          <div class="mx-auto max-w-3xl space-y-6">
            ${renderSinglePeriodNav(dayTitle, !isToday, subtleDayLeftHTML)}

            <!-- TIMELINE CONTAINER (Isolated wrapper so active block updates never touch Journal DOM) -->
            <section
              id="day-timeline-section"
              class="rounded-[24px] border paper-dot-grid p-4 sm:p-6"
              style="border-color: var(--border-warm); box-shadow: var(--shadow-paper);"
            >
              ${renderTimelineInner(dk, isToday)}
            </section>

            <!-- DAILY JOURNAL & BRAIN DUMP (Lined Paper + Hybrid Inline Tasks + Face Moods) -->
            ${renderJournalSection(dk)}
          </div>
        `;
        }

        function renderTimelineInner(dk, isToday) {
          const blocks = getBlocksForDate(dk);
          const nowExactMins = getExactNowMinutes();

          let bodyHTML = "";
          if (blocks.length === 0) {
            bodyHTML = `
            <div class="flex flex-col items-center justify-center py-10 text-center">
              <p class="font-journal text-xl text-muted">Open page — nothing scheduled yet</p>
              <button
                type="button"
                data-gap-start="09:00"
                data-gap-end="10:00"
                class="btn-primary mt-4 rounded-full px-4 py-2 text-sm font-semibold transition active:scale-95 min-h-[40px]"
              >
                + Add Block
              </button>
            </div>
          `;
          } else {
            let highWaterEnd = null;

            blocks.forEach((blk, idx) => {
              const bStart = timeToMinutes(blk.start);
              const bEnd = timeToMinutes(blk.end);

              // Open gap connector between consecutive blocks (>= 15m)
              if (highWaterEnd !== null && bStart - highWaterEnd >= 15) {
                bodyHTML += renderOpenGap(
                  minutesToTime(highWaterEnd),
                  blk.start,
                  bStart - highWaterEnd,
                );
              }

              const activeInfo = isToday
                ? getActiveBlockProgress(blk, nowExactMins)
                : null;
              bodyHTML += renderTimeBlockCard(blk, activeInfo);

              highWaterEnd =
                highWaterEnd === null ? bEnd : Math.max(highWaterEnd, bEnd);

              // Trailing open slot after last block if before 22:30
              if (idx === blocks.length - 1 && highWaterEnd <= 22 * 60 + 15) {
                const nextEnd = Math.min(23 * 60 + 45, highWaterEnd + 60);
                const gapDur = Math.max(30, nextEnd - highWaterEnd);
                bodyHTML += renderOpenGap(
                  minutesToTime(highWaterEnd),
                  minutesToTime(nextEnd),
                  gapDur,
                );
              }
            });
          }

          return `
          <div class="flex items-center justify-between gap-2 mb-4">
            <h2 class="font-hand text-[26px] font-bold text-ink leading-none">Timeline</h2>
            <button
              type="button"
              data-add-block-day="${dk}"
              class="btn-primary inline-flex items-center gap-1 rounded-full px-3.5 py-1.5 text-xs sm:text-sm font-semibold transition active:scale-95 min-h-[36px]"
            >
              <span>+ Add Block</span>
            </button>
          </div>
          <div class="space-y-1.5">
            ${bodyHTML}
          </div>
        `;
        }

        function renderOpenGap(startHHMM, endHHMM, gapMins) {
          return `
          <div class="flex items-center gap-3 py-0.5 pl-3">
            <div class="h-7 border-l-2 border-dashed" style="border-color: var(--border-dashed);"></div>
            <button
              type="button"
              data-gap-start="${startHHMM}"
              data-gap-end="${endHHMM}"
              class="group flex-1 rounded-[14px] border border-dashed px-3.5 py-1.5 text-left transition hover:opacity-95 min-h-[34px]"
              style="border-color: var(--border-dashed); background-color: color-mix(in srgb, var(--bg-paper) 65%, transparent);"
            >
              <span class="font-journal text-[16px] text-muted group-hover:text-ink transition">
                + ${formatDuration(gapMins)} open
              </span>
            </button>
          </div>
        `;
        }

        function renderTimeBlockCard(blk, activeInfo) {
          const theme = getColorTheme(blk.color);
          const durMins = Math.max(
            0,
            timeToMinutes(blk.end) - timeToMinutes(blk.start),
          );
          const subtasks = Array.isArray(blk.subtasks) ? blk.subtasks : [];
          const isActive = Boolean(activeInfo);
          const completedClass = blk.completed ? "is-completed" : "";
          const popClass =
            state.justCompletedId === blk.id ? "just-completed" : "";

          const activeCardStyle = isActive
            ? `box-shadow: 0 0 0 2px ${theme.accent}66, 0 10px 26px -10px ${theme.accent}55;`
            : "box-shadow: var(--shadow-card);";

          return `
          <article
            data-block-id="${blk.id}"
            ${isActive ? `data-active-block-id="${blk.id}"` : ""}
            class="relative overflow-hidden rounded-[20px] border-[1.5px] transition-all duration-300 ${completedClass} ${popClass} ${
              blk.completed ? "opacity-70 saturate-[0.72]" : ""
            }"
            style="background-color: ${theme.bg}; border-color: ${isActive ? theme.accent : theme.border}; ${activeCardStyle}"
          >
            <!-- Subtle Background Draining Tint (only on active live block) -->
            ${
              isActive
                ? `<div
                     data-active-bg-fill="${blk.id}"
                     class="pointer-events-none absolute inset-y-0 left-0 transition-[width] duration-1000 ease-out"
                     style="width: ${activeInfo.remainingPct.toFixed(2)}%; background-color: ${theme.fill};"
                   ></div>`
                : ""
            }

            <!-- Card Content -->
            <div class="relative z-10 p-3.5 sm:p-4">
              <div class="flex items-start gap-3">
                <!-- Hand-Drawn Circular Checkbox -->
                <button
                  type="button"
                  data-toggle-block="${blk.id}"
                  aria-label="${blk.completed ? "Mark incomplete" : "Mark complete"}"
                  aria-pressed="${blk.completed ? "true" : "false"}"
                  class="mt-0.5 flex h-9 w-9 -ml-1 -mt-0.5 shrink-0 items-center justify-center rounded-full transition hover:scale-105 active:scale-95"
                >
                  ${svgHandCircleCheckbox(blk.completed, theme.accent)}
                </button>

                <!-- Main Text & Single Concise Time Label -->
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <!-- Single Concise Time Label -->
                    <span class="text-xs font-semibold tracking-wide" style="color: ${theme.accent};">
                      ${blk.start} – ${blk.end} &middot; ${formatDuration(durMins)}
                    </span>

                    <!-- Active Live Remaining Pill -->
                    ${
                      isActive
                        ? `<span
                             class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-[11px] font-semibold"
                             style="background-color: var(--bg-card); color: ${theme.accent}; border: 1px solid ${theme.border};"
                           >
                             <span class="pulse-ink-dot h-2 w-2 rounded-full" style="background-color: ${theme.accent};"></span>
                             <span data-active-remaining="${blk.id}">${activeInfo.label}</span>
                           </span>`
                        : ""
                    }
                  </div>

                  <!-- Handwritten Title + Animated Hand-Drawn SVG Scribble -->
                  <div class="relative inline-block max-w-full mt-0.5">
                    <h3 class="font-journal text-[22px] leading-snug text-ink break-words">
                      ${escapeHTML(blk.title)}
                    </h3>
                    ${svgBlockScribble()}
                  </div>

                  <!-- Optional Subtasks -->
                  ${
                    subtasks.length > 0
                      ? `
                        <div class="mt-2 space-y-1 pt-2 border-t" style="border-color: ${theme.border};">
                          ${subtasks
                            .map(
                              (st) => `
                                <button
                                  type="button"
                                  data-toggle-subtask="${blk.id}::${st.id}"
                                  class="flex w-full items-center gap-2 rounded-[10px] py-0.5 text-left transition hover:opacity-85 ${st.done ? "subtask-done opacity-65" : ""}"
                                >
                                  <span
                                    class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-[1.5px] text-[10px] font-bold"
                                    style="border-color: ${theme.accent}; background-color: ${st.done ? theme.accent : "transparent"}; color: var(--bg-card);"
                                  >
                                    ${st.done ? "✓" : ""}
                                  </span>
                                  <span class="relative inline-block font-journal text-[16px] text-ink leading-tight">
                                    ${escapeHTML(st.text)}
                                    <svg class="subtask-scribble pointer-events-none absolute inset-y-0 left-[-2px] w-[calc(100%+4px)] h-full" viewBox="0 0 180 22" preserveAspectRatio="none" fill="none">
                                      <path d="M2 12 C 42 9, 92 15, 134 11 C 156 9, 170 13, 178 11" stroke-width="1.9" stroke-linecap="round" />
                                    </svg>
                                  </span>
                                </button>
                              `,
                            )
                            .join("")}
                        </div>
                      `
                      : ""
                  }
                </div>

                <!-- Subtle Edit & Delete Controls -->
                <div class="flex items-center gap-1 shrink-0">
                  <button
                    type="button"
                    data-edit-block="${blk.id}"
                    aria-label="Edit block"
                    class="flex h-8 w-8 items-center justify-center rounded-full text-muted transition hover:text-ink"
                    style="background-color: color-mix(in srgb, var(--bg-card) 60%, transparent);"
                  >
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 20h9" />
                      <path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    data-quick-delete="${blk.id}"
                    aria-label="Delete block"
                    class="flex h-8 w-8 items-center justify-center rounded-full text-muted transition hover:text-rose-500"
                    style="background-color: color-mix(in srgb, var(--bg-card) 60%, transparent);"
                  >
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Live Decreasing Draining Progress Bar along Bottom Edge -->
            ${
              isActive
                ? `
                  <div
                    class="drain-bar-track h-[5px] w-full"
                    style="background-color: ${theme.border}66;"
                    aria-label="Time remaining in block"
                  >
                    <div
                      data-active-bar-fill="${blk.id}"
                      class="drain-bar-fill h-full rounded-r-full"
                      style="width: ${activeInfo.remainingPct.toFixed(2)}%; background-color: ${theme.bar};"
                    ></div>
                  </div>
                `
                : ""
            }
          </article>
        `;
        }

        /* =================================================================== */
        /* 9. DAILY JOURNAL SECTION (Hybrid Brain Dump + Inline Tasks + Faces) */
        /* =================================================================== */
        function renderJournalSection(dk) {
          const journal = getJournalForDate(dk);
          const activeMoodObj =
            MOOD_FACES.find((m) => m.id === journal.mood) || null;

          return `
          <section
            id="daily-journal-card"
            class="relative rounded-[24px] border overflow-hidden"
            style="background-color: var(--bg-card); border-color: var(--border-warm); box-shadow: var(--shadow-paper);"
          >
            <!-- Subtle Washi Tape Accent -->
            <div class="washi-tape pointer-events-none absolute -top-2 left-1/2 -translate-x-1/2 h-4 w-20 rounded-sm opacity-85"></div>

            <!-- Journal Header: ONLY "Journal", subtle "+ Task", and 7 Hand-Drawn Face Moods -->
            <div class="px-4 sm:px-6 pt-5 pb-3.5 border-b border-warm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <h2 class="font-hand text-[28px] font-bold text-ink leading-none">Journal</h2>
                <button
                  id="btn-journal-add-task"
                  type="button"
                  title="Toggle or add a task line (Ctrl/Cmd+Shift+L)"
                  class="btn-ghost inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium text-muted hover:text-ink transition active:scale-95"
                >
                  <span>+ Task</span>
                </button>
              </div>

              <!-- 7 Expressive Hand-Drawn Face Mood Stamps -->
              <div class="flex flex-col items-start sm:items-end">
                <div class="flex flex-wrap items-center gap-1 sm:gap-1.5" role="group" aria-label="Daily mood">
                  ${MOOD_FACES.map((m) => {
                    const active = journal.mood === m.id;
                    return `
                      <button
                        type="button"
                        data-mood="${m.id}"
                        title="${m.label}"
                        aria-label="${m.label}"
                        aria-pressed="${active ? "true" : "false"}"
                        class="relative flex h-9 w-9 items-center justify-center rounded-full transition ${
                          active
                            ? "text-ink scale-105"
                            : "text-muted opacity-70 hover:opacity-100 hover:text-ink"
                        }"
                      >
                        ${m.svg}
                        ${active ? svgMoodCircle() : ""}
                      </button>
                    `;
                  }).join("")}
                </div>
                <span
                  id="journal-mood-label"
                  class="font-hand text-base font-semibold text-accent leading-none mt-1 min-h-[16px]"
                >
                  ${activeMoodObj ? activeMoodObj.label : ""}
                </span>
              </div>
            </div>

            <!-- Lined Notebook Paper Writing Area -->
            <div
              id="journal-paper-area"
              class="paper-ruled pl-12 pr-4 sm:pr-6 pt-0 pb-10 min-h-[256px] cursor-text"
            >
              <div id="journal-lines-list">
                ${journal.lines.map((line, i) => renderJournalLineHTML(line, i)).join("")}
              </div>
            </div>
          </section>
        `;
        }

        function renderJournalLineHTML(line, idx) {
          const isTask = line.type === "task";
          const placeholder =
            idx === 0
              ? 'Write freely... or start a line with "- " or "[] " for a task'
              : "";

          if (!isTask) {
            return `
            <div class="journal-row flex items-start" data-jline-id="${line.id}">
              <textarea
                rows="1"
                data-jline-input="${line.id}"
                placeholder="${placeholder}"
                class="journal-line-input font-journal text-[20px]"
              >${escapeHTML(line.text)}</textarea>
            </div>
          `;
          }

          // Hybrid Inline Task Row with Hand-Drawn Square Checkbox & Animated Scribble Strike-Through
          return `
          <div class="journal-row flex items-start gap-2.5 ${line.done ? "jtask-done" : ""}" data-jline-id="${line.id}">
            <button
              type="button"
              data-jtask-toggle="${line.id}"
              aria-label="${line.done ? "Uncheck task" : "Complete task"}"
              aria-pressed="${line.done ? "true" : "false"}"
              class="mt-[7px] flex h-[18px] w-[18px] shrink-0 items-center justify-center transition hover:scale-110 active:scale-95"
            >
              ${svgHandSquareCheckbox(line.done)}
            </button>
            <div class="relative flex-1 min-w-0">
              <textarea
                rows="1"
                data-jline-input="${line.id}"
                placeholder="Task..."
                class="journal-line-input font-journal text-[20px] transition-opacity duration-300 ${
                  line.done ? "opacity-50" : ""
                }"
              >${escapeHTML(line.text)}</textarea>
              <!-- Animated Hand-Drawn Ink Scribble Sized to Text -->
              <svg
                data-jtask-scribble="${line.id}"
                class="jtask-scribble pointer-events-none absolute top-0 left-0 h-[32px]"
                style="width: ${estimateTextWidthPx(line.text)}px; max-width: 100%;"
                viewBox="0 0 240 32"
                preserveAspectRatio="none"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M2 16 C 36 12, 74 20, 118 15 C 162 11, 198 19, 238 15"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  opacity="0.82"
                />
              </svg>
            </div>
          </div>
        `;
        }

        // Measure approximate rendered width of Patrick Hand 20px text so strikethrough hugs the words
        let measureCanvasCtx = null;
        function estimateTextWidthPx(text) {
          if (!text || !text.trim()) return 0;
          try {
            if (!measureCanvasCtx) {
              const c = document.createElement("canvas");
              measureCanvasCtx = c.getContext("2d");
            }
            measureCanvasCtx.font = '20px "Patrick Hand", cursive';
            return Math.ceil(measureCanvasCtx.measureText(text).width) + 10;
          } catch (e) {
            return Math.min(340, text.length * 9.5);
          }
        }

        function autoResizeJournalTextarea(el) {
          if (!el) return;
          el.style.height = "32px";
          // Snap height cleanly to multiples of 32px so wrapped lines stay seated on notebook rules
          const raw = el.scrollHeight;
          const rows = Math.max(1, Math.ceil(raw / 32));
          el.style.height = `${rows * 32}px`;
        }

        function initJournalLineHeights() {
          document.querySelectorAll(".journal-line-input").forEach((el) => {
            autoResizeJournalTextarea(el);
          });
        }

        function rerenderJournalLinesOnly(focusId = null, caretPos = null) {
          const listEl = document.getElementById("journal-lines-list");
          if (!listEl) return;
          const journal = getJournalForDate(state.selectedDate);
          listEl.innerHTML = journal.lines
            .map((line, i) => renderJournalLineHTML(line, i))
            .join("");
          initJournalLineHeights();

          if (focusId) {
            const target = listEl.querySelector(
              `[data-jline-input="${focusId}"]`,
            );
            if (target) {
              target.focus();
              const pos =
                caretPos === null
                  ? target.value.length
                  : Math.min(caretPos, target.value.length);
              target.setSelectionRange(pos, pos);
              state.focusedJournalLineId = focusId;
            }
          }
        }

        /* =================================================================== */
        /* 10. WEEK VIEW (Mobile Default: Strip + Cards; Desktop: 7 Columns)   */
        /* =================================================================== */
        function renderWeekView() {
          const monKey = getMondayOfWeek(state.selectedDate);
          const tKey = todayKey();
          const currentWeekMon = getMondayOfWeek(tKey);
          const days = Array.from({ length: 7 }, (_, i) => addDays(monKey, i));

          const monDate = parseDateKey(days[0]);
          const sunDate = parseDateKey(days[6]);
          const periodTitle =
            monDate.getMonth() === sunDate.getMonth()
              ? `${MONTH_SHORT[monDate.getMonth()]} ${monDate.getDate()} – ${sunDate.getDate()}, ${monDate.getFullYear()}`
              : `${MONTH_SHORT[monDate.getMonth()]} ${monDate.getDate()} – ${MONTH_SHORT[sunDate.getMonth()]} ${sunDate.getDate()}, ${sunDate.getFullYear()}`;

          // Mobile Top Strip
          const mobileStrip = days
            .map((dk, i) => {
              const d = parseDateKey(dk);
              const isT = dk === tKey;
              const blocks = getBlocksForDate(dk);
              return `
              <button
                type="button"
                data-open-day="${dk}"
                class="relative flex flex-col items-center justify-center rounded-[16px] border py-2 px-1 transition active:scale-95 min-h-[64px]"
                style="background-color: ${isT ? "var(--today-bg)" : "var(--bg-card)"}; border-color: ${isT ? "var(--today-border)" : "var(--border-warm)"};"
              >
                <span class="text-[10px] font-semibold uppercase tracking-wider text-muted">${WEEKDAY_MON_FIRST[i]}</span>
                <span class="relative font-hand text-[25px] font-bold leading-none mt-0.5 text-ink">
                  ${d.getDate()}
                  ${isT ? svgTodayLoop("w-9 h-8") : ""}
                </span>
                <span class="mt-1.5 flex items-center gap-0.5 h-1.5">
                  ${blocks
                    .slice(0, 4)
                    .map(
                      (b) =>
                        `<span class="h-1.5 w-1.5 rounded-full" style="background-color: ${getColorTheme(b.color).accent}; opacity: ${b.completed ? 0.35 : 0.9};"></span>`,
                    )
                    .join("")}
                </span>
              </button>
            `;
            })
            .join("");

          // Mobile Stacked Day Cards
          const mobileCards = days
            .map((dk) => {
              const d = parseDateKey(dk);
              const isT = dk === tKey;
              const blocks = getBlocksForDate(dk);
              return `
              <article
                data-open-day="${dk}"
                class="cursor-pointer rounded-[22px] border p-4 transition active:scale-[0.99]"
                style="background-color: ${isT ? "var(--today-bg)" : "var(--bg-card)"}; border-color: ${isT ? "var(--today-border)" : "var(--border-warm)"}; box-shadow: var(--shadow-paper);"
              >
                <div class="flex items-center justify-between gap-2 pb-2 border-b border-warm">
                  <div class="flex items-center gap-2.5">
                    <span class="relative flex h-10 w-10 items-center justify-center rounded-[14px] font-hand text-[26px] font-bold text-ink" style="background-color: var(--bg-soft);">
                      ${d.getDate()}
                      ${isT ? svgTodayLoop("w-11 h-10") : ""}
                    </span>
                    <span class="font-hand text-2xl font-bold text-ink leading-none">
                      ${DAY_NAMES[d.getDay()]}
                    </span>
                  </div>
                  <span class="text-xs font-medium text-muted">&rarr;</span>
                </div>

                ${
                  blocks.length > 0
                    ? `
                      <div class="mt-2.5 space-y-1.5">
                        ${blocks
                          .slice(0, 4)
                          .map((b) => {
                            const theme = getColorTheme(b.color);
                            return `
                              <div
                                class="flex items-center justify-between gap-2 rounded-[13px] border px-3 py-1.5 ${b.completed ? "opacity-60" : ""}"
                                style="background-color: ${theme.bg}; border-color: ${theme.border};"
                              >
                                <span class="font-journal text-[17px] text-ink truncate ${b.completed ? "line-through" : ""}">
                                  ${escapeHTML(b.title)}
                                </span>
                                <span class="shrink-0 text-[11px] font-semibold" style="color: ${theme.accent};">
                                  ${b.start}
                                </span>
                              </div>
                            `;
                          })
                          .join("")}
                        ${blocks.length > 4 ? `<div class="text-xs text-muted pl-1">+${blocks.length - 4} more</div>` : ""}
                      </div>
                    `
                    : `<div class="mt-2.5 font-journal text-base text-faint">Open</div>`
                }
              </article>
            `;
            })
            .join("");

          // Desktop 7-Column Board
          const desktopBoard = days
            .map((dk, i) => {
              const d = parseDateKey(dk);
              const isT = dk === tKey;
              const blocks = getBlocksForDate(dk);
              return `
              <div
                data-open-day="${dk}"
                class="cursor-pointer flex flex-col rounded-[22px] border p-3 transition hover:-translate-y-0.5 min-h-[390px]"
                style="background-color: ${isT ? "var(--today-bg)" : "var(--bg-card)"}; border-color: ${isT ? "var(--today-border)" : "var(--border-warm)"}; box-shadow: var(--shadow-paper);"
              >
                <div class="flex flex-col items-center pb-2.5 border-b border-warm">
                  <span class="text-[11px] font-semibold uppercase tracking-wider text-muted">${WEEKDAY_MON_FIRST[i]}</span>
                  <span class="relative mt-1 flex h-10 w-10 items-center justify-center font-hand text-[30px] font-bold text-ink leading-none">
                    ${d.getDate()}
                    ${isT ? svgTodayLoop("w-11 h-10") : ""}
                  </span>
                </div>
                <div class="mt-2.5 flex-1 space-y-1.5">
                  ${blocks
                    .map((b) => {
                      const theme = getColorTheme(b.color);
                      return `
                        <div
                          class="rounded-[13px] border px-2.5 py-1.5 ${b.completed ? "opacity-60" : ""}"
                          style="background-color: ${theme.bg}; border-color: ${theme.border};"
                        >
                          <div class="text-[10px] font-semibold" style="color: ${theme.accent};">${b.start}</div>
                          <div class="font-journal text-[15px] leading-snug text-ink line-clamp-2 ${b.completed ? "line-through" : ""}">
                            ${escapeHTML(b.title)}
                          </div>
                        </div>
                      `;
                    })
                    .join("")}
                </div>
              </div>
            `;
            })
            .join("");

          return `
          <div>
            ${renderSinglePeriodNav(periodTitle, monKey !== currentWeekMon)}

            <div class="md:hidden space-y-3.5">
              <div class="grid grid-cols-7 gap-1.5">${mobileStrip}</div>
              <div class="space-y-3">${mobileCards}</div>
            </div>

            <div class="hidden md:grid md:grid-cols-7 gap-2.5">
              ${desktopBoard}
            </div>
          </div>
        `;
        }

        /* =================================================================== */
        /* 11. MONTH VIEW (Desktop Default)                                    */
        /* =================================================================== */
        function renderMonthView() {
          const d = parseDateKey(state.selectedDate);
          const year = d.getFullYear();
          const month = d.getMonth();
          const tDate = parseDateKey(todayKey());
          const isCurrentMonth =
            year === tDate.getFullYear() && month === tDate.getMonth();
          const tKey = todayKey();

          const firstDay = new Date(year, month, 1);
          const startOffset = (firstDay.getDay() + 6) % 7;
          const gridStart = new Date(year, month, 1 - startOffset);
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const totalCells = startOffset + daysInMonth > 35 ? 42 : 35;

          const cellsHTML = Array.from({ length: totalCells }, (_, idx) => {
            const cellDate = new Date(gridStart);
            cellDate.setDate(gridStart.getDate() + idx);
            const dk = toDateKey(cellDate);
            const inMonth = cellDate.getMonth() === month;
            const isT = dk === tKey;
            const blocks = getBlocksForDate(dk);

            return `
            <button
              type="button"
              data-open-day="${dk}"
              class="flex flex-col items-stretch text-left rounded-[16px] sm:rounded-[20px] border p-1.5 sm:p-2.5 transition min-h-[72px] sm:min-h-[118px] lg:min-h-[130px] ${
                inMonth
                  ? "hover:-translate-y-0.5"
                  : "opacity-45 hover:opacity-80"
              }"
              style="background-color: ${
                isT
                  ? "var(--today-bg)"
                  : inMonth
                    ? "var(--bg-card)"
                    : "var(--bg-soft)"
              }; border-color: ${isT ? "var(--today-border)" : "var(--border-warm)"}; box-shadow: ${
                inMonth ? "var(--shadow-card)" : "none"
              };"
            >
              <span class="relative inline-flex h-8 w-8 items-center justify-center font-hand text-[22px] sm:text-[26px] font-bold leading-none text-ink">
                ${cellDate.getDate()}
                ${isT ? svgTodayLoop("w-10 h-9") : ""}
              </span>

              <!-- Desktop / Tablet Mini Pastel Pills -->
              <div class="hidden sm:flex flex-col gap-1 mt-1 flex-1">
                ${blocks
                  .slice(0, 3)
                  .map((b) => {
                    const theme = getColorTheme(b.color);
                    return `
                      <div
                        class="rounded-[9px] border px-2 py-0.5 truncate ${b.completed ? "opacity-55" : ""}"
                        style="background-color: ${theme.bg}; border-color: ${theme.border};"
                      >
                        <span class="font-journal text-[14px] text-ink ${b.completed ? "line-through" : ""}">
                          ${escapeHTML(b.title)}
                        </span>
                      </div>
                    `;
                  })
                  .join("")}
                ${blocks.length > 3 ? `<span class="px-1 text-[11px] font-semibold text-muted">+${blocks.length - 3}</span>` : ""}
              </div>

              <!-- Mobile Compact Dots -->
              <div class="flex sm:hidden flex-wrap gap-1 mt-auto pt-1 px-0.5">
                ${blocks
                  .slice(0, 5)
                  .map(
                    (b) =>
                      `<span class="h-2 w-2 rounded-full" style="background-color: ${getColorTheme(b.color).accent}; opacity: ${b.completed ? 0.35 : 0.9};"></span>`,
                  )
                  .join("")}
              </div>
            </button>
          `;
          }).join("");

          return `
          <div>
            ${renderSinglePeriodNav(`${MONTH_NAMES[month]} ${year}`, !isCurrentMonth)}

            <div class="grid grid-cols-7 gap-1.5 sm:gap-2.5 mb-2 px-1">
              ${WEEKDAY_MON_FIRST.map(
                (w) =>
                  `<div class="text-center font-hand text-xl sm:text-2xl font-bold text-muted">${w}</div>`,
              ).join("")}
            </div>

            <div class="grid grid-cols-7 gap-1.5 sm:gap-2.5">
              ${cellsHTML}
            </div>
          </div>
        `;
        }

        /* =================================================================== */
        /* 12. YEAR VIEW (12 Rounded Mini-Month Cards)                         */
        /* =================================================================== */
        function renderYearView() {
          const year = parseDateKey(state.selectedDate).getFullYear();
          const isCurrentYear = year === new Date().getFullYear();
          const tKey = todayKey();

          const monthsHTML = Array.from({ length: 12 }, (_, mIdx) => {
            const firstDay = new Date(year, mIdx, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, mIdx + 1, 0).getDate();

            const blanks = Array.from(
              { length: startOffset },
              () => `<div></div>`,
            ).join("");
            const dayBtns = Array.from({ length: daysInMonth }, (_, dIdx) => {
              const num = dIdx + 1;
              const dk = `${year}-${pad2(mIdx + 1)}-${pad2(num)}`;
              const isT = dk === tKey;
              const blocks = state.data.blocksByDate[dk] || [];
              const hasBlocks = blocks.length > 0;
              const allDone = hasBlocks && blocks.every((b) => b.completed);

              return `
              <button
                type="button"
                data-open-day="${dk}"
                class="relative flex flex-col items-center justify-center rounded-[10px] py-1 transition hover:opacity-80 min-h-[30px]"
              >
                <span class="relative font-hand text-[18px] font-bold leading-none ${isT ? "text-accent" : "text-ink"}">
                  ${num}
                  ${isT ? svgTodayLoop("w-7 h-7") : ""}
                </span>
                <span
                  class="mt-0.5 h-1.5 w-1.5 rounded-full"
                  style="background-color: ${hasBlocks ? (allDone ? "var(--ink-sage)" : "var(--ink-accent)") : "transparent"};"
                ></span>
              </button>
            `;
            }).join("");

            return `
            <article class="rounded-[22px] border p-4" style="background-color: var(--bg-card); border-color: var(--border-warm); box-shadow: var(--shadow-paper);">
              <button
                type="button"
                data-open-month="${year}-${pad2(mIdx + 1)}-01"
                class="font-hand text-[28px] font-bold text-ink hover:text-accent transition leading-none mb-2.5 block"
              >
                ${MONTH_NAMES[mIdx]}
              </button>
              <div class="grid grid-cols-7 gap-0.5 text-center mb-1">
