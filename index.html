                ${WEEKDAY_INITIALS.map((w) => `<span class="text-[10px] font-semibold text-muted">${w}</span>`).join("")}
              </div>
              <div class="grid grid-cols-7 gap-0.5">
                ${blanks}
                ${dayBtns}
              </div>
            </article>
          `;
          }).join("");

          return `
          <div>
            ${renderSinglePeriodNav(String(year), !isCurrentYear)}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
              ${monthsHTML}
            </div>
          </div>
        `;
        }

        /* =================================================================== */
        /* 13. LIVE 10-SECOND TICKER (Zero Journal Interruption!)              */
        /* =================================================================== */
        function computeActiveSignature(dk) {
          if (dk !== todayKey()) return "";
          const nowExact = getExactNowMinutes();
          return getBlocksForDate(dk)
            .filter((b) => Boolean(getActiveBlockProgress(b, nowExact)))
            .map((b) => b.id)
            .join(",");
        }

        function syncActiveBlockSignature() {
          state.lastActiveIdsSignature = computeActiveSignature(
            state.selectedDate,
          );
        }

        function refreshLiveDayIndicators() {
          if (state.view !== "day" || state.selectedDate !== todayKey()) return;

          // 1. Update subtle "Time Left in Day" hairline & text
          const stats = getDayTimeStats();
          const dayTextEl = document.querySelector("[data-live-day-left]");
          const dayBarEl = document.querySelector("[data-live-day-bar]");
          if (dayTextEl)
            dayTextEl.textContent = `${stats.remainingText} left today`;
          if (dayBarEl)
            dayBarEl.style.width = `${stats.pctElapsed.toFixed(1)}%`;

          // 2. Check if active set changed (e.g., a block just started or finished)
          const newSig = computeActiveSignature(state.selectedDate);
          if (newSig !== state.lastActiveIdsSignature) {
            state.lastActiveIdsSignature = newSig;
            // Re-render ONLY the timeline container — NEVER touch the Journal DOM!
            const timelineSection = document.getElementById(
              "day-timeline-section",
            );
            if (timelineSection) {
              timelineSection.innerHTML = renderTimelineInner(
                state.selectedDate,
                true,
              );
            }
            return;
          }

          // 3. Smoothly update active block countdown labels & decreasing draining bars in place
          const blocks = getBlocksForDate(state.selectedDate);
          const nowExact = stats.nowMins;
          blocks.forEach((blk) => {
            const info = getActiveBlockProgress(blk, nowExact);
            if (!info) return;
            const pctStr = `${info.remainingPct.toFixed(2)}%`;
            const labelEl = document.querySelector(
              `[data-active-remaining="${blk.id}"]`,
            );
            const barEl = document.querySelector(
              `[data-active-bar-fill="${blk.id}"]`,
            );
            const bgEl = document.querySelector(
              `[data-active-bg-fill="${blk.id}"]`,
            );
            if (labelEl) labelEl.textContent = info.label;
            if (barEl) barEl.style.width = pctStr;
            if (bgEl) bgEl.style.width = pctStr;
          });
        }

        /* =================================================================== */
        /* 14. TIME BLOCK MODAL (ADD / EDIT / DELETE)                          */
        /* =================================================================== */
        function buildModalColorPicker() {
          const wrap = document.getElementById("color-picker");
          if (!wrap) return;
          const currentSelected = getSelectedModalColor();
          wrap.innerHTML = Object.entries(PASTEL_COLORS)
            .map(([key, item]) => {
              const theme = state.nightMode ? item.night : item.light;
              return `
              <button
                type="button"
                data-pick-color="${key}"
                class="color-swatch flex flex-col items-center justify-center rounded-[14px] border-2 py-2 px-1 transition"
                style="background-color: ${theme.bg}; border-color: ${theme.border};"
              >
                <span class="h-3.5 w-3.5 rounded-full mb-1" style="background-color: ${theme.accent};"></span>
                <span class="text-[11px] font-semibold text-ink">${item.name}</span>
              </button>
            `;
            })
            .join("");
          selectModalColor(currentSelected);
        }

        function selectModalColor(colorKey) {
          document.querySelectorAll(".color-swatch").forEach((btn) => {
            const active = btn.dataset.pickColor === colorKey;
            btn.dataset.selected = active ? "true" : "false";
            btn.style.boxShadow = active ? "0 0 0 2px var(--ink-main)" : "none";
            btn.style.transform = active ? "scale(1.03)" : "scale(1)";
          });
        }

        function getSelectedModalColor() {
          const active = document.querySelector(
            '.color-swatch[data-selected="true"]',
          );
          return active ? active.dataset.pickColor : "sage";
        }

        function renderModalSubtasks() {
          const wrap = document.getElementById("modal-subtasks-list");
          if (!wrap) return;
          wrap.innerHTML = state.modalSubtasks
            .map(
              (st, i) => `
              <div class="flex items-center justify-between gap-2 rounded-[12px] border px-3 py-1.5" style="background-color: var(--bg-paper); border-color: var(--border-warm);">
                <span class="font-journal text-base text-ink truncate">${escapeHTML(st.text)}</span>
                <button type="button" data-remove-subtask="${i}" class="text-xs font-semibold text-muted hover:text-rose-500 px-1">✕</button>
              </div>
            `,
            )
            .join("");
        }

        function updateModalDurationPreview() {
          const s = timeToMinutes(document.getElementById("block-start").value);
          const e = timeToMinutes(document.getElementById("block-end").value);
          const preview = document.getElementById("modal-duration-preview");
          const err = document.getElementById("modal-time-error");
          if (e <= s) {
            preview.textContent = "";
            err.textContent = "End time must be after start time.";
            err.classList.remove("hidden");
            return false;
          }
          err.classList.add("hidden");
          preview.textContent = formatDuration(e - s);
          return true;
        }

        function openBlockModal({
          dateKey,
          block = null,
          presetStart = null,
          presetEnd = null,
        }) {
          const dk = dateKey || state.selectedDate;
          const modal = document.getElementById("modal-block");
          const titleEl = document.getElementById("modal-block-title");
          const deleteWrap = document.getElementById("delete-block-wrap");
          const deleteBtn = document.getElementById("btn-delete-block");

          state.deleteConfirmArmed = false;
          deleteBtn.textContent = "Delete";
          document.getElementById("block-date").value = dk;

          if (block) {
            titleEl.textContent = "Edit Time Block";
            document.getElementById("block-id").value = block.id;
            document.getElementById("block-title").value = block.title;
            document.getElementById("block-start").value = block.start;
            document.getElementById("block-end").value = block.end;
            selectModalColor(block.color || "sage");
            state.modalSubtasks = (block.subtasks || []).map((st) => ({
              ...st,
            }));
            deleteWrap.classList.remove("hidden");
          } else {
            titleEl.textContent = "New Time Block";
            document.getElementById("block-id").value = "";
            document.getElementById("block-title").value = "";

            let start = presetStart;
            let end = presetEnd;
            if (!start) {
              const existing = getBlocksForDate(dk);
              if (existing.length > 0) {
                const lastEnd = timeToMinutes(
                  existing[existing.length - 1].end,
                );
                start = minutesToTime(Math.min(22 * 60, lastEnd + 30));
              } else {
                const now = new Date();
                start = `${pad2(Math.min(21, Math.max(8, now.getHours())))}:00`;
              }
            }
            if (!end) {
              end = minutesToTime(
                Math.min(23 * 60 + 45, timeToMinutes(start) + 60),
              );
            }
            document.getElementById("block-start").value = start;
            document.getElementById("block-end").value = end;

            const keys = Object.keys(PASTEL_COLORS);
            selectModalColor(keys[getBlocksForDate(dk).length % keys.length]);
            state.modalSubtasks = [];
            deleteWrap.classList.add("hidden");
          }

          renderModalSubtasks();
          updateModalDurationPreview();
          modal.classList.remove("hidden");
          modal.classList.add("flex");
          setTimeout(() => document.getElementById("block-title").focus(), 50);
        }

        function closeModal(id) {
          const el = document.getElementById(id);
          if (!el) return;
          el.classList.add("hidden");
          el.classList.remove("flex");
        }

        /* =================================================================== */
        /* 15. .JSON MODAL (EXPORT, IMPORT, LOCAL FILE LINKING)                */
        /* =================================================================== */
        function openJsonModal() {
          const modal = document.getElementById("modal-json");
          const fsBadge = document.getElementById("fs-status-badge");
          const fsButtons = document.getElementById("fs-buttons-wrap");
          const fsFallback = document.getElementById("fs-fallback-note");
          const unlinkBtn = document.getElementById("btn-unlink-json");

          const fsSupported = typeof window.showSaveFilePicker === "function";
          if (state.fileHandle) {
            fsBadge.textContent = state.linkedFileName;
            unlinkBtn.classList.remove("hidden");
          } else {
            fsBadge.textContent = fsSupported
              ? "Not linked"
              : "Desktop Chrome/Edge";
            unlinkBtn.classList.add("hidden");
          }

          fsButtons.classList.toggle("hidden", !fsSupported);
          fsFallback.classList.toggle("hidden", fsSupported);

          modal.classList.remove("hidden");
          modal.classList.add("flex");
        }

        function exportJsonBackup() {
          try {
            const blob = new Blob([JSON.stringify(state.data, null, 2)], {
              type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `ink-and-day-backup-${todayKey()}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast(`Exported ink-and-day-backup-${todayKey()}.json`);
          } catch (err) {
            console.error("Export failed:", err);
            showToast("Export failed", "warn");
          }
        }

        function importJsonText(text, mode = "merge") {
          try {
            const parsed = JSON.parse(text);
            if (
              !parsed ||
              typeof parsed !== "object" ||
              (!parsed.blocksByDate && !parsed.journalByDate)
            ) {
              showToast("Invalid Ink & Day .json file", "warn");
              return;
            }

            const incomingBlocks = parsed.blocksByDate || {};
            const incomingJournals = parsed.journalByDate || {};

            if (mode === "replace") {
              state.data.blocksByDate = incomingBlocks;
              state.data.journalByDate = {};
              Object.entries(incomingJournals).forEach(([dk, entry]) => {
                state.data.journalByDate[dk] = normalizeJournalEntry(entry);
              });
            } else {
              Object.entries(incomingBlocks).forEach(([dk, list]) => {
                if (!Array.isArray(list)) return;
                const existing = state.data.blocksByDate[dk] || [];
                const seen = new Set(existing.map((b) => b.id));
                const merged = [...existing];
                list.forEach((b) => {
                  if (b && b.title && b.start && b.end && !seen.has(b.id)) {
                    merged.push({ ...b, id: b.id || genId("blk") });
                  }
                });
                state.data.blocksByDate[dk] = merged;
              });

              Object.entries(incomingJournals).forEach(([dk, entry]) => {
                const incomingNorm = normalizeJournalEntry(entry);
                const existing = state.data.journalByDate[dk];
                const existingHasText =
                  existing &&
                  existing.lines &&
                  existing.lines.some((l) => l.text.trim().length > 0);
                if (!existing || (!existingHasText && !existing.mood)) {
                  state.data.journalByDate[dk] = incomingNorm;
                }
              });
            }

            saveToStorage(true);
            renderApp();
            closeModal("modal-json");
            showToast(
              mode === "replace" ? "Restored from .json" : "Merged .json data",
            );
          } catch (err) {
            console.error("Import error:", err);
            showToast("Could not parse .json file", "warn");
          }
        }

        /* =================================================================== */
        /* 16. HYBRID JOURNAL INTERACTION HANDLERS                             */
        /* =================================================================== */
        function toggleOrInsertJournalTask() {
          const dk = state.selectedDate;
          const journal = getJournalForDate(dk);
          const lines = journal.lines;

          let targetIdx = lines.findIndex(
            (l) => l.id === state.focusedJournalLineId,
          );
          if (targetIdx !== -1) {
            const line = lines[targetIdx];
            if (line.type === "text") {
              line.type = "task";
              line.done = false;
              saveToStorage(true);
              rerenderJournalLinesOnly(line.id, line.text.length);
              return;
            }
            // Focused line is already a task: if empty, toggle back to text; if has text, add new task below
            if (!line.text.trim()) {
              line.type = "text";
              line.done = false;
              saveToStorage(true);
              rerenderJournalLinesOnly(line.id, 0);
              return;
            }
            const nextTask = {
              id: genId("jl"),
              type: "task",
              text: "",
              done: false,
            };
            lines.splice(targetIdx + 1, 0, nextTask);
            saveToStorage(true);
            rerenderJournalLinesOnly(nextTask.id, 0);
            return;
          }

          // Nothing focused: reuse last line if empty text, else append new task line
          const last = lines[lines.length - 1];
          if (last && last.type === "text" && !last.text.trim()) {
            last.type = "task";
            last.done = false;
            saveToStorage(true);
            rerenderJournalLinesOnly(last.id, 0);
          } else {
            const nextTask = {
              id: genId("jl"),
              type: "task",
              text: "",
              done: false,
            };
            lines.push(nextTask);
            saveToStorage(true);
            rerenderJournalLinesOnly(nextTask.id, 0);
          }
        }

        /* =================================================================== */
        /* 17. EVENT LISTENERS                                                 */
        /* =================================================================== */
        function setupEventListeners() {
          // Brand -> Today
          document.getElementById("btn-brand").addEventListener("click", () => {
            state.selectedDate = todayKey();
            renderApp();
          });

          // View Switcher
          document.querySelectorAll(".view-tab").forEach((btn) => {
            btn.addEventListener("click", () => {
              state.view = btn.dataset.view;
              state.justCompletedId = null;
              renderApp();
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
          });

          // Manual Night Mode Toggle
          document
            .getElementById("btn-night-toggle")
            .addEventListener("click", () => {
              state.nightMode = !state.nightMode;
              savePreferences();
              applyTheme(true);
            });

          // .json Modal
          document
            .getElementById("btn-open-json")
            .addEventListener("click", openJsonModal);

          // Close Modals
          document.querySelectorAll("[data-close-modal]").forEach((btn) => {
            btn.addEventListener("click", () =>
              closeModal(btn.dataset.closeModal),
            );
          });
          ["modal-block", "modal-json"].forEach((id) => {
            const modal = document.getElementById(id);
            modal.addEventListener("click", (e) => {
              if (e.target === modal) closeModal(id);
            });
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              closeModal("modal-block");
              closeModal("modal-json");
            }
            // Shortcut: Ctrl/Cmd + Shift + L toggles focused journal line task
            if (
              (e.metaKey || e.ctrlKey) &&
              e.shiftKey &&
              e.key.toLowerCase() === "l"
            ) {
              if (state.view === "day") {
                e.preventDefault();
                toggleOrInsertJournalTask();
              }
            }
          });

          // Delegated Clicks inside Main App
          const mainEl = document.getElementById("app-main");

          // Keep track of focused journal line before clicking + Task button
          mainEl.addEventListener("mousedown", (e) => {
            if (e.target.closest("#btn-journal-add-task")) {
              e.preventDefault(); // preserve focus reference
            }
          });

          mainEl.addEventListener("click", (e) => {
            // Period Prev / Next / Today Navigation
            const navBtn = e.target.closest("[data-nav]");
            if (navBtn) {
              const action = navBtn.dataset.nav;
              state.justCompletedId = null;
              if (action === "today") {
                state.selectedDate = todayKey();
              } else {
                const dir = action === "prev" ? -1 : 1;
                if (state.view === "day")
                  state.selectedDate = addDays(state.selectedDate, dir);
                else if (state.view === "week")
                  state.selectedDate = addDays(state.selectedDate, dir * 7);
                else if (state.view === "month")
                  state.selectedDate = addMonths(state.selectedDate, dir);
                else
                  state.selectedDate = addMonths(state.selectedDate, dir * 12);
              }
              renderApp();
              return;
            }

            // Toggle Time Block Subtask
            const subBtn = e.target.closest("[data-toggle-subtask]");
            if (subBtn) {
              e.stopPropagation();
              const [blockId, subId] = subBtn.dataset.toggleSubtask.split("::");
              const blk = (
                state.data.blocksByDate[state.selectedDate] || []
              ).find((b) => b.id === blockId);
              if (blk && Array.isArray(blk.subtasks)) {
                const st = blk.subtasks.find((s) => s.id === subId);
                if (st) {
                  st.done = !st.done;
                  saveToStorage(true);
                  const tl = document.getElementById("day-timeline-section");
                  if (tl)
                    tl.innerHTML = renderTimelineInner(
                      state.selectedDate,
                      state.selectedDate === todayKey(),
                    );
                }
              }
              return;
            }

            // Toggle Time Block Completion (Animated Scribble!)
            const toggleBtn = e.target.closest("[data-toggle-block]");
            if (toggleBtn) {
              e.stopPropagation();
              const blockId = toggleBtn.dataset.toggleBlock;
              const blk = (
                state.data.blocksByDate[state.selectedDate] || []
              ).find((b) => b.id === blockId);
              if (blk) {
                blk.completed = !blk.completed;
                state.justCompletedId = blk.completed ? blk.id : null;
                saveToStorage(true);

                const article = toggleBtn.closest("article[data-block-id]");
                if (article) {
                  article.classList.toggle("is-completed", blk.completed);
                  if (blk.completed) article.classList.add("just-completed");
                  setTimeout(() => {
                    state.justCompletedId = null;
                    const tl = document.getElementById("day-timeline-section");
                    if (tl) {
                      tl.innerHTML = renderTimelineInner(
                        state.selectedDate,
                        state.selectedDate === todayKey(),
                      );
                      syncActiveBlockSignature();
                    }
                  }, 460);
                }
              }
              return;
            }

            // Edit Time Block
            const editBtn = e.target.closest("[data-edit-block]");
            if (editBtn) {
              e.stopPropagation();
              const blk = (
                state.data.blocksByDate[state.selectedDate] || []
              ).find((b) => b.id === editBtn.dataset.editBlock);
              if (blk)
                openBlockModal({ dateKey: state.selectedDate, block: blk });
              return;
            }

            // Quick Two-Tap Safe Delete on Time Block Card
            const delBtn = e.target.closest("[data-quick-delete]");
            if (delBtn) {
              e.stopPropagation();
              const blockId = delBtn.dataset.quickDelete;
              if (delBtn.dataset.armed !== "true") {
                delBtn.dataset.armed = "true";
                delBtn.style.backgroundColor = "rgba(225, 29, 72, 0.16)";
                delBtn.style.color = "#e11d48";
                showToast("Tap trash again to delete");
                setTimeout(() => {
                  if (delBtn && delBtn.isConnected) {
                    delBtn.dataset.armed = "false";
                    delBtn.style.backgroundColor = "";
                    delBtn.style.color = "";
                  }
                }, 2600);
                return;
              }
              state.data.blocksByDate[state.selectedDate] = (
                state.data.blocksByDate[state.selectedDate] || []
              ).filter((b) => b.id !== blockId);
              if (state.data.blocksByDate[state.selectedDate].length === 0) {
                delete state.data.blocksByDate[state.selectedDate];
              }
              saveToStorage(true);
              const tl = document.getElementById("day-timeline-section");
              if (tl) {
                tl.innerHTML = renderTimelineInner(
                  state.selectedDate,
                  state.selectedDate === todayKey(),
                );
                syncActiveBlockSignature();
              }
              showToast("Block deleted");
              return;
            }

            // Open Gap Connector -> Pre-fill Modal
            const gapBtn = e.target.closest("[data-gap-start]");
            if (gapBtn) {
              openBlockModal({
                dateKey: state.selectedDate,
                presetStart: gapBtn.dataset.gapStart,
                presetEnd: gapBtn.dataset.gapEnd,
              });
              return;
            }

            // + Add Block in Day Timeline
            const addBtn = e.target.closest("[data-add-block-day]");
            if (addBtn) {
              openBlockModal({ dateKey: addBtn.dataset.addBlockDay });
              return;
            }

            // Journal: + Task button
            if (e.target.closest("#btn-journal-add-task")) {
              toggleOrInsertJournalTask();
              return;
            }

            // Journal: Mood Face Stamp Selection (updates mood UI without wiping typing)
            const moodBtn = e.target.closest("[data-mood]");
            if (moodBtn) {
              const dk = state.selectedDate;
              const journal = getJournalForDate(dk);
              const picked = moodBtn.dataset.mood;
              journal.mood = journal.mood === picked ? "" : picked;
              saveToStorage(true);

              // Update mood buttons & handwritten mood word cleanly in place
              const card = document.getElementById("daily-journal-card");
              if (card) {
                card.querySelectorAll("[data-mood]").forEach((b) => {
                  const isActive = b.dataset.mood === journal.mood;
                  const mObj = MOOD_FACES.find((m) => m.id === b.dataset.mood);
                  b.setAttribute("aria-pressed", isActive ? "true" : "false");
                  b.className = `relative flex h-9 w-9 items-center justify-center rounded-full transition ${
                    isActive
                      ? "text-ink scale-105"
                      : "text-muted opacity-70 hover:opacity-100 hover:text-ink"
                  }`;
                  b.innerHTML = `${mObj.svg}${isActive ? svgMoodCircle() : ""}`;
                });
                const lbl = document.getElementById("journal-mood-label");
                const activeObj = MOOD_FACES.find((m) => m.id === journal.mood);
                if (lbl) lbl.textContent = activeObj ? activeObj.label : "";
              }
              return;
            }

            // Journal: Toggle Inline Task Checkbox (with smooth hand-drawn strikethrough!)
            const jTaskBtn = e.target.closest("[data-jtask-toggle]");
            if (jTaskBtn) {
              e.stopPropagation();
              const lineId = jTaskBtn.dataset.jtaskToggle;
              const journal = getJournalForDate(state.selectedDate);
              const line = journal.lines.find((l) => l.id === lineId);
              if (line) {
                line.done = !line.done;
                saveToStorage(true);
                const row = jTaskBtn.closest(".journal-row");
                if (row) {
                  row.classList.toggle("jtask-done", line.done);
                  jTaskBtn.setAttribute(
                    "aria-pressed",
                    line.done ? "true" : "false",
                  );
                  jTaskBtn.innerHTML = svgHandSquareCheckbox(line.done);
                  const input = row.querySelector(".journal-line-input");
                  if (input) input.classList.toggle("opacity-50", line.done);
                  const svg = row.querySelector("[data-jtask-scribble]");
                  if (svg)
                    svg.style.width = `${estimateTextWidthPx(line.text)}px`;
                }
              }
              return;
            }

            // Journal: Clicking Empty Ruled Area Below Last Line Focuses/Creates Line
            if (
              e.target.id === "journal-paper-area" ||
              e.target.id === "journal-lines-list"
            ) {
              const journal = getJournalForDate(state.selectedDate);
              const last = journal.lines[journal.lines.length - 1];
              if (!last || (last.type === "task" && last.done)) {
                const fresh = {
                  id: genId("jl"),
                  type: "text",
                  text: "",
                  done: false,
                };
                journal.lines.push(fresh);
                saveToStorage(true);
                rerenderJournalLinesOnly(fresh.id, 0);
              } else {
                const el = mainEl.querySelector(
                  `[data-jline-input="${last.id}"]`,
                );
                if (el) {
                  el.focus();
                  el.setSelectionRange(el.value.length, el.value.length);
                }
              }
              return;
            }

            // Calendar Navigation: Month Title in Year View -> Month View
            const monthBtn = e.target.closest("[data-open-month]");
            if (monthBtn) {
              state.selectedDate = monthBtn.dataset.openMonth;
              state.view = "month";
              renderApp();
              window.scrollTo({ top: 0, behavior: "smooth" });
              return;
            }

            // Calendar Navigation: Any Day Cell -> Day Planner
            const dayEl = e.target.closest("[data-open-day]");
            if (dayEl) {
              state.selectedDate = dayEl.dataset.openDay;
              state.view = "day";
              state.justCompletedId = null;
              renderApp();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });

          // Journal Focus Tracking
          mainEl.addEventListener("focusin", (e) => {
            const inp = e.target.closest("[data-jline-input]");
            if (inp) state.focusedJournalLineId = inp.dataset.jlineInput;
          });

          // Journal Live Typing & Automatic Prefix Conversion ("[] ", "[ ] ", "- ", "* ")
          mainEl.addEventListener("input", (e) => {
            const inp = e.target.closest("[data-jline-input]");
            if (!inp) return;
            const lineId = inp.dataset.jlineInput;
            const journal = getJournalForDate(state.selectedDate);
            const line = journal.lines.find((l) => l.id === lineId);
            if (!line) return;

            const val = inp.value;

            // Auto-convert text line to task when starting with "[] ", "[ ] ", "- ", or "* "
            if (line.type === "text" && /^(\[\s?\]|-|\*)\s/.test(val)) {
              const match = val.match(/^(\[\s?\]|-|\*)\s/);
              const stripped = val.slice(match[0].length);
              const newCaret = Math.max(
                0,
                (inp.selectionStart || 0) - match[0].length,
              );
              line.type = "task";
              line.done = false;
              line.text = stripped;
              saveToStorage(true);
              rerenderJournalLinesOnly(line.id, newCaret);
              return;
            }

            line.text = val;
            autoResizeJournalTextarea(inp);
            if (line.type === "task") {
              const svg = mainEl.querySelector(
                `[data-jtask-scribble="${line.id}"]`,
              );
              if (svg) svg.style.width = `${estimateTextWidthPx(val)}px`;
            }
            saveToStorage(true);
          });

          // Journal Natural Keyboard Handling (Enter, Backspace, ArrowUp/ArrowDown)
          mainEl.addEventListener("keydown", (e) => {
            const inp = e.target.closest("[data-jline-input]");
            if (!inp) return;

            const lineId = inp.dataset.jlineInput;
            const journal = getJournalForDate(state.selectedDate);
            const idx = journal.lines.findIndex((l) => l.id === lineId);
            if (idx === -1) return;
            const line = journal.lines[idx];

            // ENTER -> split or continue task/text cleanly
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              const pos = inp.selectionStart || 0;
              const before = line.text.slice(0, pos);
              const after = line.text.slice(inp.selectionEnd || pos);

              // Empty task + Enter -> convert back to regular text line
              if (line.type === "task" && !line.text.trim()) {
                line.type = "text";
                line.done = false;
                saveToStorage(true);
                rerenderJournalLinesOnly(line.id, 0);
                return;
              }

              line.text = before;
              const newType = line.type === "task" ? "task" : "text";
              const newLine = {
                id: genId("jl"),
                type: newType,
                text: after,
                done: false,
              };
              journal.lines.splice(idx + 1, 0, newLine);
              saveToStorage(true);
              rerenderJournalLinesOnly(newLine.id, 0);
              return;
            }

            // BACKSPACE at caret 0 -> un-task or merge with previous line
            if (
              e.key === "Backspace" &&
              inp.selectionStart === 0 &&
              inp.selectionEnd === 0
            ) {
              if (line.type === "task") {
                e.preventDefault();
                line.type = "text";
                line.done = false;
                saveToStorage(true);
                rerenderJournalLinesOnly(line.id, 0);
                return;
              }
              if (idx > 0) {
                e.preventDefault();
                const prev = journal.lines[idx - 1];
                const joinPos = prev.text.length;
                prev.text = prev.text + line.text;
                journal.lines.splice(idx, 1);
                saveToStorage(true);
                rerenderJournalLinesOnly(prev.id, joinPos);
                return;
              }
            }

            // ARROW UP -> jump to previous line when at top/start
            if (e.key === "ArrowUp" && idx > 0) {
              const atStart =
                inp.selectionStart === 0 ||
                !inp.value.slice(0, inp.selectionStart).includes("\n");
              if (atStart && inp.scrollHeight <= 34) {
                e.preventDefault();
                const prev = journal.lines[idx - 1];
                const prevEl = mainEl.querySelector(
                  `[data-jline-input="${prev.id}"]`,
                );
                if (prevEl) {
                  prevEl.focus();
                  prevEl.setSelectionRange(
                    prevEl.value.length,
                    prevEl.value.length,
                  );
                }
              }
            }

            // ARROW DOWN -> jump to next line when at bottom/end
            if (e.key === "ArrowDown" && idx < journal.lines.length - 1) {
              if (inp.scrollHeight <= 34) {
                e.preventDefault();
                const next = journal.lines[idx + 1];
                const nextEl = mainEl.querySelector(
                  `[data-jline-input="${next.id}"]`,
                );
                if (nextEl) {
                  nextEl.focus();
                  nextEl.setSelectionRange(
                    nextEl.value.length,
                    nextEl.value.length,
                  );
                }
              }
            }
          });

          // Modal: Color Swatches & Time Helpers
          document
            .getElementById("color-picker")
            .addEventListener("click", (e) => {
              const btn = e.target.closest("[data-pick-color]");
              if (btn) selectModalColor(btn.dataset.pickColor);
            });

          document
            .getElementById("block-start")
            .addEventListener("input", updateModalDurationPreview);
          document
            .getElementById("block-end")
            .addEventListener("input", updateModalDurationPreview);

          document.querySelectorAll(".dur-chip").forEach((chip) => {
            chip.addEventListener("click", () => {
              const mins = Number(chip.dataset.dur);
              const startVal =
                document.getElementById("block-start").value || "09:00";
              const endMins = Math.min(
                23 * 60 + 55,
                timeToMinutes(startVal) + mins,
              );
              document.getElementById("block-end").value =
                minutesToTime(endMins);
              updateModalDurationPreview();
            });
          });

          // Modal: Subtasks
          const addSubtask = () => {
            const input = document.getElementById("new-subtask-input");
            const text = input.value.trim();
            if (!text) return;
            state.modalSubtasks.push({ id: genId("st"), text, done: false });
            input.value = "";
            renderModalSubtasks();
          };
          document
            .getElementById("btn-add-subtask")
            .addEventListener("click", addSubtask);
          document
            .getElementById("new-subtask-input")
            .addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                addSubtask();
              }
            });
          document
            .getElementById("modal-subtasks-list")
            .addEventListener("click", (e) => {
              const btn = e.target.closest("[data-remove-subtask]");
              if (btn) {
                state.modalSubtasks.splice(
                  Number(btn.dataset.removeSubtask),
                  1,
                );
                renderModalSubtasks();
              }
            });

          // Modal: Save Time Block
          document
            .getElementById("form-block")
            .addEventListener("submit", (e) => {
              e.preventDefault();
              if (!updateModalDurationPreview()) return;

              const id = document.getElementById("block-id").value;
              const dk =
                document.getElementById("block-date").value ||
                state.selectedDate;
              const title = document.getElementById("block-title").value.trim();
              if (!title) return;

              const start = document.getElementById("block-start").value;
              const end = document.getElementById("block-end").value;
              const color = getSelectedModalColor();

              if (!state.data.blocksByDate[dk])
                state.data.blocksByDate[dk] = [];
              const list = state.data.blocksByDate[dk];

              if (id) {
                const idx = list.findIndex((b) => b.id === id);
                if (idx !== -1) {
                  list[idx] = {
                    ...list[idx],
                    title,
                    start,
                    end,
                    color,
                    subtasks: [...state.modalSubtasks],
                  };
                }
              } else {
                list.push({
                  id: genId("blk"),
                  title,
                  start,
                  end,
                  color,
                  subtasks: [...state.modalSubtasks],
                  completed: false,
                });
              }

              state.selectedDate = dk;
              saveToStorage(true);
              closeModal("modal-block");

              // If already on Day View, refresh only the timeline to avoid disrupting Journal
              if (state.view === "day") {
                const tl = document.getElementById("day-timeline-section");
                if (tl) {
                  tl.innerHTML = renderTimelineInner(dk, dk === todayKey());
                  syncActiveBlockSignature();
                  return;
                }
              }
              state.view = "day";
              renderApp();
            });

          // Modal: Safe Two-Step Delete
          document
            .getElementById("btn-delete-block")
            .addEventListener("click", () => {
              const btn = document.getElementById("btn-delete-block");
              if (!state.deleteConfirmArmed) {
                state.deleteConfirmArmed = true;
                btn.textContent = "Confirm delete";
                return;
              }
              const id = document.getElementById("block-id").value;
              const dk =
                document.getElementById("block-date").value ||
                state.selectedDate;
              if (state.data.blocksByDate[dk]) {
                state.data.blocksByDate[dk] = state.data.blocksByDate[
                  dk
                ].filter((b) => b.id !== id);
                if (state.data.blocksByDate[dk].length === 0)
                  delete state.data.blocksByDate[dk];
              }
              saveToStorage(true);
              closeModal("modal-block");
              const tl = document.getElementById("day-timeline-section");
              if (state.view === "day" && tl) {
                tl.innerHTML = renderTimelineInner(dk, dk === todayKey());
                syncActiveBlockSignature();
              } else {
                renderApp();
              }
              showToast("Block deleted");
            });

          // JSON Modal Actions
          document
            .getElementById("btn-export-json")
            .addEventListener("click", exportJsonBackup);
          document
            .getElementById("btn-import-json")
            .addEventListener("click", () => {
              document.getElementById("input-import-json").click();
            });
          document
            .getElementById("input-import-json")
            .addEventListener("change", (e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                const mode = document.querySelector(
                  'input[name="import-mode"]:checked',
                );
                importJsonText(
                  String(reader.result || ""),
                  mode ? mode.value : "merge",
                );
                e.target.value = "";
              };
              reader.readAsText(file);
            });

          document
            .getElementById("btn-link-new-json")
            .addEventListener("click", async () => {
              try {
                const handle = await window.showSaveFilePicker({
                  suggestedName: `ink-and-day-backup-${todayKey()}.json`,
                  types: [
                    {
                      description: "JSON Files",
                      accept: { "application/json": [".json"] },
                    },
                  ],
                });
                state.fileHandle = handle;
                state.linkedFileName = handle.name || "ink-and-day.json";
                await writeToLinkedFile(true);
                renderHeader();
                openJsonModal();
              } catch (err) {
                if (err && err.name !== "AbortError") {
                  document
                    .getElementById("fs-fallback-note")
                    .classList.remove("hidden");
                }
              }
            });

          document
            .getElementById("btn-link-open-json")
            .addEventListener("click", async () => {
              try {
                const [handle] = await window.showOpenFilePicker({
                  types: [
                    {
                      description: "JSON Files",
                      accept: { "application/json": [".json"] },
                    },
                  ],
                  multiple: false,
                });
                const file = await handle.getFile();
                const text = await file.text();
                state.fileHandle = handle;
                state.linkedFileName = handle.name || "ink-and-day.json";
                const mode = document.querySelector(
                  'input[name="import-mode"]:checked',
                );
                importJsonText(text, mode ? mode.value : "merge");
                renderHeader();
              } catch (err) {
                if (err && err.name !== "AbortError") {
                  document
                    .getElementById("fs-fallback-note")
                    .classList.remove("hidden");
                }
              }
            });

          document
            .getElementById("btn-unlink-json")
            .addEventListener("click", () => {
              state.fileHandle = null;
              state.linkedFileName = null;
              renderHeader();
              openJsonModal();
              showToast("Unlinked local file");
            });

          document
            .getElementById("btn-copy-json")
            .addEventListener("click", () => {
              const temp = document.createElement("textarea");
              temp.value = JSON.stringify(state.data, null, 2);
              temp.setAttribute("readonly", "");
              temp.style.position = "fixed";
              temp.style.opacity = "0";
              document.body.appendChild(temp);
              temp.select();
              try {
                document.execCommand("copy");
                showToast("Copied JSON");
              } catch (err) {
                showToast("Copy failed", "warn");
              }
              temp.remove();
            });
        }

        /* =================================================================== */
        /* 18. INITIALIZATION                                                  */
        /* =================================================================== */
        function init() {
          loadFromStorage();
          buildModalColorPicker();
          setupEventListeners();
          renderApp();

          // Smooth 10-second live updates for Day-left hairline & Active Block draining bar
          setInterval(refreshLiveDayIndicators, 10000);
        }

        window.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
